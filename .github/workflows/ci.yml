name: CMake CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run PolimorficSmart simple tests
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path build/PolimorficSmart/Release) simple_test.exe
          & $exe

      - name: Run PolimorficSmart threaded tests
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path build/PolimorficSmart/Release) threaded_tests.exe
          & $exe
