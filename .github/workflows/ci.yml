name: CMake CI

on:
  push:
  pull_request:

jobs:
  coverage-linux-console:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain summary (coverage)
        run: |
          cmake --version
          c++ --version
          gcov --version

      - name: Configure (console-only, coverage)
        run: cmake -S . -B build_coverage_linux -DBUILD_TESTING=ON -DBUILD_WINDOWS_EXAMPLES=OFF -DEASYEXAMPLES_ENABLE_COVERAGE=ON

      - name: Build (console-only, coverage)
        run: cmake --build build_coverage_linux

      - name: Validate test discovery (coverage)
        run: |
          listing="$(ctest --test-dir build_coverage_linux -N)"
          echo "$listing"
          count="$(echo "$listing" | sed -n 's/.*Total Tests: \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$count" ]; then
            echo "CTest did not report total test count in coverage-linux-console job."
            exit 1
          fi
          if [ "$count" -lt 6 ]; then
            echo "Expected at least 6 tests in coverage-linux-console job, found $count."
            exit 1
          fi
          echo "Discovered tests: $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests (coverage)
        run: ctest --test-dir build_coverage_linux --output-on-failure

      - name: Collect coverage file summary
        if: always()
        run: |
          gcno_count="$(find build_coverage_linux -type f -name '*.gcno' | wc -l)"
          gcda_count="$(find build_coverage_linux -type f -name '*.gcda' | wc -l)"
          echo "gcno files: $gcno_count"
          echo "gcda files: $gcda_count"
          mkdir -p coverage_report
          coverage_summary_file="coverage_report/raw-coverage-summary.txt"
          {
            echo "Raw coverage artifact summary"
            echo "============================="
            echo "gcno files: $gcno_count"
            echo "gcda files: $gcda_count"
            echo
            echo "Per-module artifact counts (gcno + gcda):"
          } > "$coverage_summary_file"

          find build_coverage_linux -type f \( -name '*.gcno' -o -name '*.gcda' \) \
            | awk -F'/' '
                {
                  module = "misc";
                  for (i = 1; i <= NF; ++i) {
                    if ($i ~ /^(VsCodeCmakeEasiest|VsCodeCmakeW2src|ModernCPP_Containers|ExceptionHandling|PolimorficSmart)$/) {
                      module = $i;
                    }
                  }
                  counts[module]++;
                }
                END {
                  for (m in counts) {
                    printf "%s %d\n", m, counts[m];
                  }
                }
              ' \
            | sort \
            | awk '{printf "- %s: %s\n", $1, $2}' >> "$coverage_summary_file"

          {
            echo "## Coverage Artifacts"
            echo "- gcno files: $gcno_count"
            echo "- gcda files: $gcda_count"
            echo "- Per-module summary stored in artifact: coverage_report/raw-coverage-summary.txt"
            echo
            echo "### Per-module artifact counts"
            sed -n '1,120p' "$coverage_summary_file" | tail -n +7
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw-linux-console
          if-no-files-found: ignore
          path: |
            build_coverage_linux/**/*.gcno
            build_coverage_linux/**/*.gcda
            build_coverage_linux/Testing/Temporary/**
            build_coverage_linux/**/Test.xml
            coverage_report/raw-coverage-summary.txt

  build-linux-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain summary
        run: |
          cmake --version
          c++ --version

      - name: Configure (console-only)
        run: cmake -S . -B build_linux -DBUILD_TESTING=ON -DBUILD_WINDOWS_EXAMPLES=OFF

      - name: Build (console-only)
        run: cmake --build build_linux

      - name: Validate test discovery (console-only)
        run: |
          listing="$(ctest --test-dir build_linux -N)"
          echo "$listing"
          count="$(echo "$listing" | sed -n 's/.*Total Tests: \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$count" ]; then
            echo "CTest did not report total test count in build-linux-console job."
            exit 1
          fi
          if [ "$count" -lt 6 ]; then
            echo "Expected at least 6 tests in build-linux-console job, found $count."
            exit 1
          fi
          echo "Discovered tests: $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests (console-only)
        run: ctest --test-dir build_linux --output-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-build-linux-console
          if-no-files-found: ignore
          path: |
            build_linux/Testing/Temporary/**
            build_linux/**/Test.xml
            build_linux/CMakeFiles/CMakeOutput.log
            build_linux/CMakeFiles/CMakeError.log

  build-linux-console-clang:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain summary (clang)
        run: |
          cmake --version
          clang --version
          clang++ --version

      - name: Configure (console-only, clang)
        run: cmake -S . -B build_linux_clang -DBUILD_TESTING=ON -DBUILD_WINDOWS_EXAMPLES=OFF

      - name: Build (console-only, clang)
        run: cmake --build build_linux_clang

      - name: Validate test discovery (console-only, clang)
        run: |
          listing="$(ctest --test-dir build_linux_clang -N)"
          echo "$listing"
          count="$(echo "$listing" | sed -n 's/.*Total Tests: \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$count" ]; then
            echo "CTest did not report total test count in build-linux-console-clang job."
            exit 1
          fi
          if [ "$count" -lt 6 ]; then
            echo "Expected at least 6 tests in build-linux-console-clang job, found $count."
            exit 1
          fi
          echo "Discovered tests: $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests (console-only, clang)
        run: ctest --test-dir build_linux_clang --output-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-build-linux-console-clang
          if-no-files-found: ignore
          path: |
            build_linux_clang/Testing/Temporary/**
            build_linux_clang/**/Test.xml
            build_linux_clang/CMakeFiles/CMakeOutput.log
            build_linux_clang/CMakeFiles/CMakeError.log

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Validate test discovery
        shell: pwsh
        run: |
          $listing = ctest --test-dir build -C ${{ matrix.config }} -N
          $listing
          $match = [regex]::Match($listing, 'Total Tests:\s+(\d+)')
          if (-not $match.Success) {
            throw 'CTest did not report total test count.'
          }
          $count = [int]$match.Groups[1].Value
          if ($count -lt 7) {
            throw "Expected at least 7 tests in build-windows job, found $count."
          }
          "Discovered tests: $count" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-build-${{ matrix.config }}
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/**
            build/**/Test.xml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log

  strict-warnings-polimorficsmart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strict config summary
        shell: pwsh
        run: |
          @"
          ## Strict warnings - PolimorficSmart
          - Scope: PolimorficSmart only
          - EASYEXAMPLES_STRICT_WARNINGS=ON
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Configure strict warnings
        run: cmake -S PolimorficSmart -B build_strict -DBUILD_TESTING=ON -DEASYEXAMPLES_STRICT_WARNINGS=ON

      - name: Build strict warnings
        run: cmake --build build_strict --config Debug

      - name: Validate strict test discovery
        shell: pwsh
        run: |
          $listing = ctest --test-dir build_strict -C Debug -N
          $listing
          $match = [regex]::Match($listing, 'Total Tests:\s+(\d+)')
          if (-not $match.Success) {
            throw 'CTest did not report total test count in strict warnings job.'
          }
          $count = [int]$match.Groups[1].Value
          if ($count -lt 2) {
            throw "Expected at least 2 tests in strict warnings job, found $count."
          }
          "Discovered tests: $count" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run strict tests
        run: ctest --test-dir build_strict -C Debug --output-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-strict-polimorficsmart
          if-no-files-found: ignore
          path: |
            build_strict/Testing/Temporary/**
            build_strict/**/Test.xml
            build_strict/CMakeFiles/CMakeOutput.log
            build_strict/CMakeFiles/CMakeError.log

  strict-warnings-root-selected:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strict config summary
        shell: pwsh
        run: |
          @"
          ## Strict warnings - Root selected
          - EASYEXAMPLES_STRICT_WARNINGS=ON
          - BUILD_WINDOWS_EXAMPLES=OFF
          - PolimorficSmart selector=ON
          - ModernCPP_Containers selector=ON
          - ExceptionHandling selector=ON
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Configure strict warnings from root (selected modules)
        run: cmake -S . -B build_strict_root -DBUILD_TESTING=ON -DEASYEXAMPLES_STRICT_WARNINGS=ON -DBUILD_WINDOWS_EXAMPLES=OFF

      - name: Build strict warnings from root
        run: cmake --build build_strict_root --config Debug

      - name: Validate strict root test discovery
        shell: pwsh
        run: |
          $listing = ctest --test-dir build_strict_root -C Debug -N
          $listing
          $match = [regex]::Match($listing, 'Total Tests:\s+(\d+)')
          if (-not $match.Success) {
            throw 'CTest did not report total test count in strict root warnings job.'
          }
          $count = [int]$match.Groups[1].Value
          if ($count -lt 6) {
            throw "Expected at least 6 tests in strict root warnings job, found $count."
          }
          "Discovered tests: $count" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run strict root tests
        run: ctest --test-dir build_strict_root -C Debug --output-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-strict-root-selected
          if-no-files-found: ignore
          path: |
            build_strict_root/Testing/Temporary/**
            build_strict_root/**/Test.xml
            build_strict_root/CMakeFiles/CMakeOutput.log
            build_strict_root/CMakeFiles/CMakeError.log

  strict-warnings-selector-isolation:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        disabled_selector:
          - EASYEXAMPLES_STRICT_WARNINGS_MODERNCPP_CONTAINERS
          - EASYEXAMPLES_STRICT_WARNINGS_EXCEPTION_HANDLING
    steps:
      - uses: actions/checkout@v4

      - name: Isolation config summary
        shell: pwsh
        run: |
          @"
          ## Strict warnings - Selector isolation
          - EASYEXAMPLES_STRICT_WARNINGS=ON
          - BUILD_WINDOWS_EXAMPLES=OFF
          - Disabled selector: ${{ matrix.disabled_selector }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Configure strict warnings with one selector disabled
        shell: pwsh
        run: |
          cmake -S . -B build_strict_isolation -DBUILD_TESTING=ON -DEASYEXAMPLES_STRICT_WARNINGS=ON -DBUILD_WINDOWS_EXAMPLES=OFF "-D${{ matrix.disabled_selector }}=OFF"

      - name: Build strict warnings with one selector disabled
        run: cmake --build build_strict_isolation --config Debug

      - name: Validate isolation test discovery
        shell: pwsh
        run: |
          $listing = ctest --test-dir build_strict_isolation -C Debug -N
          $listing
          $match = [regex]::Match($listing, 'Total Tests:\s+(\d+)')
          if (-not $match.Success) {
            throw 'CTest did not report total test count in strict selector isolation job.'
          }
          $count = [int]$match.Groups[1].Value
          if ($count -lt 6) {
            throw "Expected at least 6 tests in strict selector isolation job, found $count."
          }
          "Discovered tests: $count" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run isolation tests
        run: ctest --test-dir build_strict_isolation -C Debug --output-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-strict-isolation-${{ matrix.disabled_selector }}
          if-no-files-found: ignore
          path: |
            build_strict_isolation/Testing/Temporary/**
            build_strict_isolation/**/Test.xml
            build_strict_isolation/CMakeFiles/CMakeOutput.log
            build_strict_isolation/CMakeFiles/CMakeError.log
